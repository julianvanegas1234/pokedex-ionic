<ion-content [fullscreen]="true">
  <div class="escena"
       (pointerdown)="onDown($event)"
       (pointermove)="onMove($event)"
       (pointerup)="onUp()"
       (pointerleave)="onUp()">

    <video #video autoplay playsinline muted></video>

    @for (p of pokes; track p.id) {
      @if (p.visible) {
        <button class="poke" [style.left.%]="p.x" [style.top.%]="p.y" (click)="abrir(p.id)">
          <img [src]="img(p.id)" alt="Pokémon" draggable="false" />
        </button>
      }
    }

    <button class="btn volver" (click)="volver()">← Volver</button>
    <button class="btn otros" (click)="sortear()">Otros 5</button>

    <div class="aviso">
      {{ sensor ? 'Gira el celular para buscarlos' : 'Sin sensor: arrastra el dedo para girar' }}
    </div>

    @if (error) {
      <div class="error">
        <p>{{ error }}</p>
        <button class="btn" (click)="iniciarCamara()">Reintentar</button>
      </div>
    }
  </div>
</ion-content>

<style>
  ion-content { --background: #000; }
  .escena {
    position: absolute; inset: 0; overflow: hidden;
    touch-action: none; user-select: none;
  }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .poke {
    position: absolute; width: 55vw; max-width: 320px;
    transform: translate(-50%, -50%);
    background: none; border: none; padding: 0;
  }
  .poke img {
    width: 100%; display: block;
    filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.45));
    animation: flotar 2.4s ease-in-out infinite;
  }
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .btn {
    position: absolute; z-index: 5;
    background: #e8505b; color: #fff; font-weight: bold;
    border: 2px solid #fff; border-radius: 22px;
    padding: 10px 18px; font-size: 15px;
  }
  .volver { top: 16px; left: 16px; }
  .otros { bottom: 24px; left: 50%; transform: translateX(-50%); }
  .aviso {
    position: absolute; top: 20px; right: 12px; z-index: 5;
    background: rgba(0, 0, 0, 0.55); color: #fff;
    padding: 6px 12px; border-radius: 14px; font-size: 12px;
    max-width: 45vw; text-align: center;
  }
  .error {
    position: absolute; inset: 0; z-index: 6;
    background: rgba(0, 0, 0, 0.8); color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center;
  }
  .error .btn { position: static; }
</style>
